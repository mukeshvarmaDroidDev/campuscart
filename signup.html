<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusCart | Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="assets/rec-logo.jpeg" alt="Raghu Engineering College logo">
      <h1>Join CampusCart</h1>
      <p>Sign up with your <strong>REC college email</strong> to start buying & selling on campus</p>
    </div>

    <form id="signup-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="e.g. Ravi Teja" required>
      </div>
      <div class="form-group">
        <label for="rollNo">Roll Number</label>
        <input type="text" id="rollNo" placeholder="e.g. 20951A0501" required>
      </div>
      <div class="form-group">
        <label for="email">College Email</label>
        <input type="email" id="email" placeholder="rollno@raghuenggcollege.in" required>
        <div class="hint">Auto-fills from your roll number, but double-check it</div>
      </div>
      <div class="form-group">
        <label for="password">Create Password</label>
        <input type="password" id="password" placeholder="Choose a password" required>
      </div>
      <div class="error-text" id="signup-error"></div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <div class="auth-switch">
      Already have an account? <a href="index.html">Login</a>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
